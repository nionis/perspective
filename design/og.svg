<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="spent" width="6" height="64" patternUnits="userSpaceOnUse">
      <rect width="2" height="64" fill="#2E2E2E"/>
    </pattern>
    <pattern id="left" width="6" height="64" patternUnits="userSpaceOnUse">
      <rect width="2" height="64" fill="#F2EEE6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>

  <g font-family="SF Mono, Menlo, monospace" font-size="18" letter-spacing="3" fill="#A39E95">
    <text x="72" y="96">PERSPECTIVE</text>
    <text x="1128" y="96" text-anchor="end">A YEAR, IN DAYS</text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="124" letter-spacing="-5" fill="#F2EEE6">
    <text x="72" y="280">The time</text>
    <text x="72" y="404">still left.</text>
  </g>

  <rect x="72" y="478" width="654" height="64" fill="url(#spent)"/>
  <rect x="726" y="478" width="402" height="64" fill="url(#left)"/>

  <g font-family="SF Mono, Menlo, monospace" font-size="16" letter-spacing="2" fill="#A39E95">
    <text x="72" y="596">NOTHING IS SAVED</text>
    <text x="1128" y="596" text-anchor="end">PERSPECTIVE.NONICORP.COM</text>
  </g>
</svg>
